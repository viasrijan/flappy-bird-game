<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flappy Bird</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        #gameContainer {
            position: relative;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            border: 3px solid #e94560;
        }

        #gameCanvas {
            display: block;
            border-radius: 18px;
            background: linear-gradient(180deg, #87CEEB 0%, #87CEEB 60%, #90EE90 60%, #228B22 100%);
            cursor: pointer;
            touch-action: none;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 18px;
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay h1 {
            font-size: 3.5rem;
            color: #fff;
            text-shadow: 0 4px 20px rgba(233, 69, 96, 0.5);
            margin-bottom: 0.5rem;
        }

        .overlay h2 {
            font-size: 2.5rem;
            color: #e94560;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.3);
            margin-bottom: 1rem;
        }

        .overlay p {
            color: #fff;
            font-size: 1.1rem;
            margin: 0.3rem 0;
        }

        .controls {
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .controls p {
            font-size: 0.9rem;
            color: #ccc;
            margin: 0.2rem 0;
        }

        button {
            padding: 12px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #e94560, #c23152);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            touch-action: manipulation;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(233, 69, 96, 0.5);
        }

        button:active {
            transform: scale(0.95);
        }

        #scoreDisplay {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 3rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        #highScore {
            color: #ffd700;
            font-weight: bold;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        button {
            animation: pulse 2s ease-in-out infinite;
        }

        @media (max-width: 500px) {
            #gameCanvas {
                width: 100vw;
                height: 150vw;
                max-width: 400px;
                max-height: 600px;
            }
            
            .overlay h1 {
                font-size: 2.5rem;
            }
            
            .overlay h2 {
                font-size: 2rem;
            }
            
            #scoreDisplay {
                font-size: 2rem;
                right: 20px;
                top: 15px;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        
        <div id="scoreDisplay">0</div>

        <div id="startScreen" class="overlay">
            <h1>🐦 Flappy Bird</h1>
            <p>Press <strong>SPACE</strong> or <strong>Click</strong> to fly</p>
            <button id="startBtn">Start Game</button>
            <div class="controls">
                <p>⬆️ Up Arrow / Space / Click</p>
                <p>🏆 Best: <span id="highScore">0</span></p>
            </div>
        </div>

        <div id="gameOverScreen" class="overlay hidden">
            <h2>💀 Game Over</h2>
            <p>Score: <span id="finalScore">0</span></p>
            <p>Best: <span id="bestScore">0</span></p>
            <button id="restartBtn">Play Again</button>
        </div>
    </div>

    <script>
        // ============================================
        // COMPLETE GAME CODE - All in one file
        // ============================================
        
        (function() {
            'use strict';

            // Canvas setup
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            
            // DOM elements
            const scoreDisplay = document.getElementById('scoreDisplay');
            const highScoreSpan = document.getElementById('highScore');
            const finalScoreSpan = document.getElementById('finalScore');
            const bestScoreSpan = document.getElementById('bestScore');
            const startScreen = document.getElementById('startScreen');
            const gameOverScreen = document.getElementById('gameOverScreen');
            const startBtn = document.getElementById('startBtn');
            const restartBtn = document.getElementById('restartBtn');

            // Game constants
            const GRAVITY = 0.6;
            const JUMP_FORCE = -10;
            const PIPE_WIDTH = 52;
            const PIPE_GAP = 150;
            const PIPE_SPEED = 2.5;
            const BIRD_SIZE = 17;

            // Game state
            let bird = { x: 60, y: 300, velocity: 0, rotation: 0 };
            let pipes = [];
            let score = 0;
            let bestScore = parseInt(localStorage.getItem('flappyBest')) || 0;
            let gameRunning = false;
            let gameOver = false;
            let frameCount = 0;
            let groundOffset = 0;
            
            // Clouds
            let clouds = [];

            function initClouds() {
                clouds = [];
                for (let i = 0; i < 5; i++) {
                    clouds.push({
                        x: Math.random() * 400,
                        y: Math.random() * 200 + 20,
                        width: Math.random() * 60 + 30,
                        speed: Math.random() * 0.3 + 0.1
                    });
                }
            }
            initClouds();

            // Update high score display
            function updateHighScore() {
                highScoreSpan.textContent = bestScore;
                bestScoreSpan.textContent = bestScore;
            }
            updateHighScore();

            // Reset game
            function resetGame() {
                bird.x = 60;
                bird.y = 300;
                bird.velocity = 0;
                bird.rotation = 0;
                pipes = [];
                score = 0;
                gameOver = false;
                gameRunning = false;
                frameCount = 0;
                scoreDisplay.textContent = '0';
                startScreen.classList.remove('hidden');
                gameOverScreen.classList.add('hidden');
            }

            // Start game
            function startGame() {
                resetGame();
                gameRunning = true;
                startScreen.classList.add('hidden');
                gameOverScreen.classList.add('hidden');
            }

            // End game
            function endGame() {
                if (gameOver) return;
                gameRunning = false;
                gameOver = true;
                
                if (score > bestScore) {
                    bestScore = score;
                    localStorage.setItem('flappyBest', bestScore.toString());
                    updateHighScore();
                }
                
                finalScoreSpan.textContent = score;
                bestScoreSpan.textContent = bestScore;
                gameOverScreen.classList.remove('hidden');
            }

            // Jump
            function jump() {
                if (gameOver) {
                    startGame();
                    return;
                }
                if (!gameRunning) {
                    startGame();
                    return;
                }
                bird.velocity = JUMP_FORCE;
                bird.rotation = -0.4;
            }

            // Create pipe
            function createPipe() {
                const minHeight = 60;
                const maxHeight = canvas.height - PIPE_GAP - minHeight - 50;
                const height = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
                pipes.push({
                    x: canvas.width,
                    height: height,
                    scored: false
                });
            }

            // Check collision
            function checkCollision(pipe) {
                const bLeft = bird.x - BIRD_SIZE;
                const bRight = bird.x + BIRD_SIZE;
                const bTop = bird.y - BIRD_SIZE;
                const bBottom = bird.y + BIRD_SIZE;
                
                const pLeft = pipe.x;
                const pRight = pipe.x + PIPE_WIDTH;
                const pTop = pipe.height;
                const pBottom = pipe.height + PIPE_GAP;
                
                if (bRight > pLeft && bLeft < pRight) {
                    if (bTop < pTop || bBottom > pBottom) {
                        return true;
                    }
                }
                return false;
            }

            // Update game
            function update() {
                if (!gameRunning || gameOver) return;
                
                frameCount++;
                
                // Bird physics
                bird.velocity += GRAVITY;
                bird.y += bird.velocity;
                bird.rotation = Math.min(Math.max(bird.velocity * 0.05, -0.5), 0.5);
                
                // Boundaries
                if (bird.y - BIRD_SIZE < 0) {
                    bird.y = BIRD_SIZE;
                    bird.velocity = 0;
                }
                if (bird.y + BIRD_SIZE > canvas.height - 50) {
                    endGame();
                    return;
                }
                
                // Spawn pipes
                if (frameCount % 90 === 0) {
                    createPipe();
                }
                
                // Update pipes
                for (let i = pipes.length - 1; i >= 0; i--) {
                    const pipe = pipes[i];
                    pipe.x -= PIPE_SPEED;
                    
                    // Score
                    if (!pipe.scored && pipe.x + PIPE_WIDTH < bird.x) {
                        pipe.scored = true;
                        score++;
                        scoreDisplay.textContent = score;
                    }
                    
                    // Remove offscreen
                    if (pipe.x + PIPE_WIDTH < 0) {
                        pipes.splice(i, 1);
                        continue;
                    }
                    
                    // Collision
                    if (checkCollision(pipe)) {
                        endGame();
                        return;
                    }
                }
                
                // Update clouds
                clouds.forEach(cloud => {
                    cloud.x -= cloud.speed;
                    if (cloud.x + cloud.width < 0) {
                        cloud.x = canvas.width + 20;
                        cloud.y = Math.random() * 200 + 20;
                    }
                });
                
                // Ground animation
                groundOffset = (groundOffset + 1) % 20;
            }

            // Draw game
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Sky gradient
                const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.6);
                gradient.addColorStop(0, '#87CEEB');
                gradient.addColorStop(1, '#E0F6FF');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height * 0.6);
                
                // Clouds
                clouds.forEach(cloud => {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                    ctx.beginPath();
                    ctx.arc(cloud.x, cloud.y, cloud.width * 0.3, 0, Math.PI * 2);
                    ctx.arc(cloud.x + cloud.width * 0.3, cloud.y - cloud.width * 0.2, cloud.width * 0.4, 0, Math.PI * 2);
                    ctx.arc(cloud.x + cloud.width * 0.6, cloud.y - cloud.width * 0.1, cloud.width * 0.35, 0, Math.PI * 2);
                    ctx.arc(cloud.x + cloud.width * 0.8, cloud.y, cloud.width * 0.25, 0, Math.PI * 2);
                    ctx.fill();
                });
                
                // Pipes
                pipes.forEach(pipe => {
                    // Top pipe
                    ctx.fillStyle = '#2e8b57';
                    ctx.fillRect(pipe.x, 0, PIPE_WIDTH, pipe.height);
                    ctx.fillStyle = '#228B22';
                    ctx.fillRect(pipe.x - 5, pipe.height - 30, PIPE_WIDTH + 10, 30);
                    ctx.fillStyle = 'rgba(255,255,255,0.1)';
                    ctx.fillRect(pipe.x + 5, 0, 10, pipe.height);
                    
                    // Bottom pipe
                    ctx.fillStyle = '#2e8b57';
                    ctx.fillRect(pipe.x, pipe.height + PIPE_GAP, PIPE_WIDTH, canvas.height - pipe.height - PIPE_GAP);
                    ctx.fillStyle = '#228B22';
                    ctx.fillRect(pipe.x - 5, pipe.height + PIPE_GAP, PIPE_WIDTH + 10, 30);
                    ctx.fillStyle = 'rgba(255,255,255,0.1)';
                    ctx.fillRect(pipe.x + 5, pipe.height + PIPE_GAP + 30, 10, canvas.height - pipe.height - PIPE_GAP);
                });
                
                // Ground
                ctx.fillStyle = '#228B22';
                ctx.fillRect(0, canvas.height - 50, canvas.width, 50);
                ctx.fillStyle = '#1a6b1a';
                ctx.fillRect(0, canvas.height - 55, canvas.width, 5);
                
                ctx.fillStyle = '#2e8b57';
                for (let i = -groundOffset; i < canvas.width + 20; i += 20) {
                    ctx.fillRect(i, canvas.height - 35, 10, 15);
                    ctx.fillRect(i + 10, canvas.height - 45, 10, 10);
                }
                
                // Bird
                ctx.save();
                ctx.translate(bird.x, bird.y);
                ctx.rotate(bird.rotation);
                
                // Body
                const birdGradient = ctx.createRadialGradient(0, 0, 5, 0, 0, BIRD_SIZE);
                birdGradient.addColorStop(0, '#FFD700');
                birdGradient.addColorStop(1, '#FFA500');
                ctx.fillStyle = birdGradient;
                ctx.beginPath();
                ctx.arc(0, 0, BIRD_SIZE, 0, Math.PI * 2);
                ctx.fill();
                
                // Eye
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(8, -5, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#1a1a2e';
                ctx.beginPath();
                ctx.arc(10, -5, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(12, -7, 1.5, 0, Math.PI * 2);
                ctx.fill();
                
                // Beak
                ctx.fillStyle = '#FF6B35';
                ctx.beginPath();
                ctx.moveTo(BIRD_SIZE, 0);
                ctx.lineTo(BIRD_SIZE + 10, 3);
                ctx.lineTo(BIRD_SIZE, 6);
                ctx.closePath();
                ctx.fill();
                
                // Wing
                ctx.fillStyle = 'rgba(255, 165, 0, 0.6)';
                ctx.beginPath();
                ctx.ellipse(-8, -3, 12, 8, -0.3, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }

            // Game loop
            function gameLoop() {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            }

            // Event listeners
            function setupEvents() {
                // Keyboard
                document.addEventListener('keydown', (e) => {
                    if (e.code === 'Space' || e.key === 'ArrowUp' || e.key === ' ') {
                        e.preventDefault();
                        jump();
                    }
                });
                
                // Mouse click on canvas
                canvas.addEventListener('click', (e) => {
                    e.preventDefault();
                    jump();
                });
                
                // Touch events
                canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    jump();
                }, { passive: false });
                
                // Buttons
                startBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    startGame();
                });
                
                restartBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    startGame();
                });
            }

            // Initialize
            function init() {
                resetGame();
                setupEvents();
                gameLoop();
                console.log('🐦 Flappy Bird initialized!');
            }

            // Start when page loads
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
